name: goreleaser

on:
  workflow_dispatch:
    inputs:
      release-mode:
        description: Full release or recovery mode; full recovery requires an existing empty release
        required: true
        type: choice
        default: packages-only
        options:
          - packages-only
          - full
      release-version:
        description: Exact existing vMAJOR.MINOR.PATCH tag for recovery
        required: false
        type: string
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write

jobs:
  goreleaser:
    uses: libops/.github/.github/workflows/sitectl-plugin-goreleaser.yaml@ec2d455628cf2d2a3497a7661ee7815b0fb1ee2d # main
    permissions:
      contents: write
      id-token: write
    secrets:
      HOMEBREW_REPO: ${{ secrets.HOMEBREW_REPO }}
    with:
      go-version: "1.26.5"
      release-mode: ${{ github.ref_type == 'tag' && 'full' || inputs.release-mode }}
      release-version: ${{ inputs.release-version }}
      package-name: sitectl-drupal
      sitectl-ref: b59060469c3e1bd95105405107f4a3c9290b8f99 # v1.10.0
