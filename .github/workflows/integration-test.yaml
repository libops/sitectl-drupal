name: integration-test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  create-drupal:
    name: sitectl create drupal ${{ matrix.create_definition }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - create_definition: default
            create_args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.x"

      - name: Install sitectl
        uses: libops/.github/.github/actions/install-sitectl@86054f5880f0b782dc1c3338895e1755e2c975f1 # main
        with:
          packages: sitectl
          package-versions: sitectl=1.9.0
          allow-unversioned: false

      - name: setup git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Run create integration test
        run: make integration-test CREATE_DEFINITION=${{ matrix.create_definition }} CREATE_ARGS="${{ matrix.create_args }}"
        env:
          TERM: xterm-256color
